name: Eski sürümleri sil (r78–r107, tek seferlik)

# Yalnızca elle başlatılır. v1.0.0 öncesi "r<N>" etiketli yayınları ve etiketlerini kalıcı olarak siler.
# "v…" etiketli yayınlara dokunmaz. İş bitince bu dosya depodan kaldırılır.
on:
  workflow_dispatch:
    inputs:
      onay:
        description: 'Kalıcı silme, geri alınamaz. Onaylamak için SIL yazın.'
        required: true

permissions:
  contents: write

jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - name: r<N> yayınlarını ve etiketlerini sil
        env:
          GH_TOKEN: ${{ github.token }}
          ONAY: ${{ inputs.onay }}
        run: |
          [ "$ONAY" = "SIL" ] || { echo "::error::Onay verilmedi (SIL yazılmalı); hiçbir şey silinmedi."; exit 1; }
          R="repos/$GITHUB_REPOSITORY"
          gh api "$R/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name | test("^r[0-9]+$")) | "\(.id) \(.tag_name)"' > eski.txt
          echo "Silinecek yayın: $(wc -l < eski.txt)"
          while read -r id tag; do
            gh api -X DELETE "$R/releases/$id" && echo "yayın silindi: $tag"
          done < eski.txt
          gh api "$R/git/matching-refs/tags/r" --paginate \
            --jq '.[].ref | ltrimstr("refs/tags/") | select(test("^r[0-9]+$"))' > etiket.txt
          while read -r tag; do
            gh api -X DELETE "$R/git/refs/tags/$tag" && echo "etiket silindi: $tag"
          done < etiket.txt
          echo "Kalan yayınlar:"; gh api "$R/releases?per_page=100" --jq '.[].tag_name'
