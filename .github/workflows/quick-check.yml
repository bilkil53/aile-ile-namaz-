name: Hızlı kontrol (analiz + birim testleri, yayın yok)

# Yalnızca check/* dallarına gönderilince çalışır: büyük değişikliklerde (ör. çeviri) derlemeyi
# beklemeden kodun hatasız olduğu birkaç dakikada görülür. Hiçbir zaman yayın yapmaz.
on:
  push:
    branches: ['check/**']

permissions:
  contents: read

concurrency:
  group: quick-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Paket kilit dosyası (pubspec.lock)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec-lock
          path: pubspec.lock
      - name: Kod analizi
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          rc=$?
          cat analyze.txt
          grep -E '^\s*(error|warning) •' analyze.txt | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          exit $rc
      - name: Birim testleri
        run: flutter test
