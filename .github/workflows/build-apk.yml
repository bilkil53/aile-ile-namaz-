name: Android APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

# Görünen sürüm: v1.<N> (N = derleme 13'ten itibaren 1, 2, 3 …). Büyük değişiklikte APP_MAJOR "2" yapılır.
# Derleme numarası (BUILD_NO = son r<N> yayını + 1, v1.0 ile 1'den başladı) sadece arka planda:
# Android versionCode + uygulama içi güncelleme karşılaştırması. Yayın etiketi r<N>.
env:
  APP_MAJOR: "1"
  MINOR_BASE: "12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platform dosyalarını oluştur
        run: flutter create . --org com.bilkil53 --project-name aile_ile_namaz --platforms android

      - name: Kapanma sebebi okuyucu (MainActivity)
        run: |
          f=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          cp android-config/kotlin/MainActivity.kt "$f"
          cp android-config/kotlin/App.kt "$(dirname "$f")/App.kt"
          grep -q getHistoricalProcessExitReasons "$f"
          # Uygulama simgesi (eski uygulamanın logosu: minare, hilal ve E harfi)
          cp -r android-config/res/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          # Zamanlanmış bildirim alıcısı R8 küçültmesinde bozulmasın
          cp android-config/proguard-rules.pro android/app/proguard-rules.pro

      - name: Manifest düzenle (internet izni, giriş dönüş bağlantısı, uygulama adı)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
              'android.permission.INTERNET',
              'android.permission.REQUEST_INSTALL_PACKAGES',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
          ]
          for perm in perms:
              if perm not in s:
                  s = s.replace('<application', f'<uses-permission android:name="{perm}"/>\n    <application', 1)
          intent = '''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="io.supabase.aileilenamaz" android:host="login-callback" />
                      </intent-filter>'''
          s = s.replace('</activity>', intent + '\n        </activity>', 1)
          s = s.replace('android:label="aile_ile_namaz"', 'android:label="Aile İle Namaz"')
          if 'android:roundIcon' not in s:
              s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          # Çökme kaydedici için kendi Application sınıfımız
          s = s.replace('android:name="${applicationName}"', 'android:name=".App"', 1)
          assert 'android:name=".App"' in s, 'Application adı değiştirilemedi'
          # Güncelleme APK'sını kurulum ekranına vermek için kendi FileProvider'ımız
          provider = '''<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.aileupdate" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/aile_update_paths" />
                  </provider>'''
          s = s.replace('</application>', provider + '\n    </application>', 1)
          import os as _os
          _os.makedirs('android/app/src/main/res/xml', exist_ok=True)
          open('android/app/src/main/res/xml/aile_update_paths.xml', 'w', encoding='utf-8').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n  <cache-path name="cache" path="." />\n  <files-path name="files" path="." />\n'
              '  <external-cache-path name="ext_cache" path="." />\n  <external-files-path name="ext_files" path="." />\n</paths>\n')
          # Tek pencere: güncelleme kurulumundan sonra "Aç" denince eski ve yeni iki kopya görünmesin
          s = s.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"', 1)
          assert 'android:launchMode="singleTask"' in s, 'launchMode değiştirilemedi'
          # Android otomatik yedeklemesi kapalı: oturum bilgisi Drive yedeğine / başka cihaza taşınmaz.
          # Kişinin namaz ve kaza kayıtları zaten hesabına bağlı bulutta; girişte otomatik geri gelir.
          if 'android:allowBackup' not in s:
              s = s.replace('<application', '<application android:allowBackup="false" android:fullBackupContent="false" android:dataExtractionRules="@xml/data_extraction_rules"', 1)
          import os
          os.makedirs('android/app/src/main/res/xml', exist_ok=True)
          open('android/app/src/main/res/xml/data_extraction_rules.xml', 'w', encoding='utf-8').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<data-extraction-rules>\n'
              '  <cloud-backup><exclude domain="root" /><exclude domain="sharedpref" /><exclude domain="database" /><exclude domain="file" /></cloud-backup>\n'
              '  <device-transfer><exclude domain="root" /><exclude domain="sharedpref" /><exclude domain="database" /><exclude domain="file" /></device-transfer>\n'
              '</data-extraction-rules>\n')
          receivers = '''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>'''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receivers + '\n    </application>', 1)
          # Android 11+: mail ve tarayıcı uygulamalarını görebilmek için
          q = '''<intent><action android:name="android.intent.action.SENDTO" /><data android:scheme="mailto" /></intent>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>'''
          if 'android:scheme="mailto"' not in s:
              if '<queries>' in s:
                  s = s.replace('<queries>', '<queries>\n        ' + q, 1)
              else:
                  s = s.replace('</manifest>', '    <queries>\n        ' + q + '\n    </queries>\n</manifest>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Gradle ayarları (bildirim eklentisi için Java kütüphane desteği)
        run: |
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          if os.path.exists(kts):
              s = open(kts, encoding='utf-8').read()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n    implementation("androidx.core:core:1.13.1")\n}\n'
              open(kts, 'w', encoding='utf-8').write(s)
          else:
              p = 'android/app/build.gradle'
              s = open(p, encoding='utf-8').read()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n    implementation 'androidx.core:core:1.13.1'\n}\n"
              open(p, 'w', encoding='utf-8').write(s)
          print('desugaring ok')
          PY

      - name: Firebase Gradle eklentisi (google-services)
        run: |
          cp android-config/google-services.json android/app/google-services.json
          python3 - <<'PY'
          import re
          st = 'android/settings.gradle.kts'
          s = open(st, encoding='utf-8').read()
          if 'com.google.gms.google-services' not in s:
              s = re.sub(r'(plugins\s*\{[^}]*?id\("com\.android\.application"\)[^\n]*\n)',
                         r'\1    id("com.google.gms.google-services") version "4.4.2" apply false\n',
                         s, count=1)
          open(st, 'w', encoding='utf-8').write(s)
          ap = 'android/app/build.gradle.kts'
          s = open(ap, encoding='utf-8').read()
          if 'com.google.gms.google-services' not in s:
              s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          open(ap, 'w', encoding='utf-8').write(s)
          print(open(st).read()[:1200])
          PY
          # Eklenti eksikse anlık bildirim çalışmaz: derlemeyi durdur
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts
          { echo '## Firebase Gradle eklentileri'; echo '```'; grep -n 'google\|crashlytics' android/settings.gradle.kts android/app/build.gradle.kts; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Kalıcı imza anahtarını ayarla (Google girişi için SHA-1 sabit kalmalı)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret yok; APK geçici anahtarla imzalanacak ve telefondan Google hesap seçimi çalışmayacak."
            exit 0
          fi
          # Takma ad gizli değil; secret yoksa "upload" kullan. Anahtar şifresi = depo şifresi.
          KEY_ALIAS="${KEY_ALIAS:-upload}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              p = kts
              block = '''    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {'''
              s = open(p, encoding='utf-8').read()
              s = s.replace('    buildTypes {', block, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
          else:
              p = groovy
              block = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {'''
              s = open(p, encoding='utf-8').read()
              s = s.replace('    buildTypes {', block, 1)
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          open(p, 'w', encoding='utf-8').write(s)
          print('release signing ->', p, 'signingConfigs' in s and 'release' in s)
          PY

      - run: flutter pub get

      - name: Kod analizi (hatalar özet sayfasına yazılır)
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          cat analyze.txt
          {
            echo '## flutter analyze'
            echo '```'
            head -c 6000 analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*error •' analyze.txt | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
          exit 0

      - name: Derleme numarası (r1, r2, r3 … yalnızca resmi yayınlara göre artar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Yayınlar ve etiketlerin en büyüğü: bir yayın yanlışlıkla silinse bile numara geri gitmez
          rel=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            -q '[.[].tagName | select(test("^r[0-9]+$")) | ltrimstr("r") | tonumber] | max // 0')
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/r" --paginate \
            -q '[.[].ref | ltrimstr("refs/tags/") | select(test("^r[0-9]+$")) | ltrimstr("r") | tonumber] | max // 0')
          last=$(( rel > tag ? rel : tag ))
          echo "BUILD_NO=$((last + 1))" >> "$GITHUB_ENV"
          # Görünen sürüm: v1.1, v1.2, v1.3 … (derleme 13 = v1.1)
          minor=$((last + 1 - ${{ env.MINOR_BASE }})); [ "$minor" -lt 0 ] && minor=0
          echo "APP_VERSION=${{ env.APP_MAJOR }}.$minor" >> "$GITHUB_ENV"
          echo "Derleme numarası: $((last + 1))"

      - name: APK derle
        run: |
          set +e
          flutter build apk --release --build-number=${{ env.BUILD_NO }} --build-name=${{ env.APP_VERSION }} --obfuscate --split-debug-info=build/symbols > build.txt 2>&1
          code=$?
          tail -n 80 build.txt
          {
            echo '## flutter build apk'
            echo '```'
            tail -c 6000 build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            grep -iE 'error|exception|failure|what went wrong' build.txt | head -15 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $code

      - name: Bildirim alıcısı koruma kontrolü (R8)
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p /tmp/dexchk && unzip -o -q "$apk" 'classes*.dex' -d /tmp/dexchk
          # Kural uygulandıysa eklentinin model sınıfı adıyla (karıştırılmadan) durur
          strings -n 8 /tmp/dexchk/classes*.dex | grep -q 'Lcom/dexterous/flutterlocalnotifications/models/NotificationDetails;' \
            || { echo '::error::proguard-rules.pro uygulanmadı (bildirim alıcısı bozulur)'; exit 1; }
          strings -n 8 /tmp/dexchk/classes*.dex | grep -q 'Lcom/bilkil53/aile_ile_namaz/App;' \
            || { echo '::error::App sınıfı APK içinde yok'; exit 1; }
          echo 'R8 koruma kuralları APK içinde ✓'

      - name: APK dosya adını sabitle + işlemci türüne göre küçük APK'lar
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk aile-ile-namaz.apk
          flutter build apk --release --split-per-abi --build-number=${{ env.BUILD_NO }} --build-name=${{ env.APP_VERSION }} \
            --obfuscate --split-debug-info=build/symbols-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "aile-ile-namaz-$abi.apk"
          done
          ls -la aile-ile-namaz*.apk

      - name: Google Play paketi (AAB) — Play güncellemesi, APK kurma izni yok
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          s = s.replace('<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>',
                        '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" tools:node="remove"/>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          flutter build appbundle --release --build-number=${{ env.BUILD_NO }} --build-name=${{ env.APP_VERSION }} \
            --dart-define=STORE=play --obfuscate --split-debug-info=build/symbols-play
          cp build/app/outputs/bundle/release/app-release.aab aile-ile-namaz.aab
          (cd build && zip -qr ../debug-symbols.zip symbols symbols-play symbols-abi)

      - uses: actions/upload-artifact@v4
        with:
          name: aile-ile-namaz-apk
          path: |
            aile-ile-namaz*.apk
            aile-ile-namaz.aab
            debug-symbols.zip

      - name: Sürüm notlarını hazırla (RELEASE_NOTES.md + teknik ayrıntılar)
        if: github.ref == 'refs/heads/main'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          V="v${{ env.APP_VERSION }}"
          D="$(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
          echo "RELEASE_TITLE=$V — $D" >> "$GITHUB_ENV"
          {
            # İlk satır uygulama içi güncelleme penceresinde gösterilir
            echo "$(head -n 1 RELEASE_NOTES.md)"
            tail -n +2 RELEASE_NOTES.md
            echo
            echo "---"
            echo "**Sürüm:** $V · derleme ${{ env.BUILD_NO }} · $D (İstanbul) · commit \`${GITHUB_SHA::7}\`"
            echo
            echo "**Bu güncellemedeki değişiklik:** $(printf '%s' "$COMMIT_MSG" | head -n 1)"
          } > release_body.md

      - name: Yayınla (uygulama içi güncelleme buradan okur)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ env.BUILD_NO }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_body.md
          prerelease: false
          make_latest: true
          files: |
            aile-ile-namaz.apk
            aile-ile-namaz-arm64-v8a.apk
            aile-ile-namaz-armeabi-v7a.apk
            aile-ile-namaz-x86_64.apk
            aile-ile-namaz.aab
