name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platform dosyalarını oluştur
        run: flutter create . --org com.bilkil53 --project-name aile_ile_namaz --platforms android

      - name: Manifest düzenle (internet izni, giriş dönüş bağlantısı, uygulama adı)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          intent = '''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="io.supabase.aileilenamaz" android:host="login-callback" />
                      </intent-filter>'''
          s = s.replace('</activity>', intent + '\n        </activity>', 1)
          s = s.replace('android:label="aile_ile_namaz"', 'android:label="Aile İle Namaz"')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: APK derle
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: aile-ile-namaz-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Yayınla (telefondan indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
