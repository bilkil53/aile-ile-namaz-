name: Android APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

# Görünen sürüm: v1.0 (büyük değişiklikte "2.0" yapılır).
# Derleme numarası (BUILD_NO = son r<N> yayını + 1, v1.0 ile 1'den başladı) sadece arka planda:
# Android versionCode + uygulama içi güncelleme karşılaştırması. Yayın etiketi r<N>.
env:
  APP_VERSION: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platform dosyalarını oluştur
        run: flutter create . --org com.bilkil53 --project-name aile_ile_namaz --platforms android

      - name: Manifest düzenle (internet izni, giriş dönüş bağlantısı, uygulama adı)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
              'android.permission.INTERNET',
              'android.permission.REQUEST_INSTALL_PACKAGES',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
          ]
          for perm in perms:
              if perm not in s:
                  s = s.replace('<application', f'<uses-permission android:name="{perm}"/>\n    <application', 1)
          intent = '''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="io.supabase.aileilenamaz" android:host="login-callback" />
                      </intent-filter>'''
          s = s.replace('</activity>', intent + '\n        </activity>', 1)
          s = s.replace('android:label="aile_ile_namaz"', 'android:label="Aile İle Namaz"')
          receivers = '''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>'''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receivers + '\n    </application>', 1)
          # Android 11+: mail ve tarayıcı uygulamalarını görebilmek için
          q = '''<intent><action android:name="android.intent.action.SENDTO" /><data android:scheme="mailto" /></intent>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>'''
          if 'android:scheme="mailto"' not in s:
              if '<queries>' in s:
                  s = s.replace('<queries>', '<queries>\n        ' + q, 1)
              else:
                  s = s.replace('</manifest>', '    <queries>\n        ' + q + '\n    </queries>\n</manifest>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Gradle ayarları (bildirim eklentisi için Java kütüphane desteği)
        run: |
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          if os.path.exists(kts):
              s = open(kts, encoding='utf-8').read()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(kts, 'w', encoding='utf-8').write(s)
          else:
              p = 'android/app/build.gradle'
              s = open(p, encoding='utf-8').read()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              open(p, 'w', encoding='utf-8').write(s)
          print('desugaring ok')
          PY

      - name: Kalıcı imza anahtarını ayarla (Google girişi için SHA-1 sabit kalmalı)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret yok; APK geçici anahtarla imzalanacak ve telefondan Google hesap seçimi çalışmayacak."
            exit 0
          fi
          # Takma ad gizli değil; secret yoksa "upload" kullan. Anahtar şifresi = depo şifresi.
          KEY_ALIAS="${KEY_ALIAS:-upload}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              p = kts
              block = '''    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {'''
              s = open(p, encoding='utf-8').read()
              s = s.replace('    buildTypes {', block, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
          else:
              p = groovy
              block = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {'''
              s = open(p, encoding='utf-8').read()
              s = s.replace('    buildTypes {', block, 1)
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          open(p, 'w', encoding='utf-8').write(s)
          print('release signing ->', p, 'signingConfigs' in s and 'release' in s)
          PY

      - run: flutter pub get

      - name: Kod analizi (hatalar özet sayfasına yazılır)
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          cat analyze.txt
          {
            echo '## flutter analyze'
            echo '```'
            head -c 6000 analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*error •' analyze.txt | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
          exit 0

      - name: Derleme numarası (r1, r2, r3 … yalnızca resmi yayınlara göre artar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            -q '[.[].tagName | select(test("^r[0-9]+$")) | ltrimstr("r") | tonumber] | max // 0')
          echo "BUILD_NO=$((last + 1))" >> "$GITHUB_ENV"
          echo "Derleme numarası: $((last + 1))"

      - name: APK derle
        run: |
          set +e
          flutter build apk --release --build-number=${{ env.BUILD_NO }} --build-name=${{ env.APP_VERSION }} > build.txt 2>&1
          code=$?
          tail -n 80 build.txt
          {
            echo '## flutter build apk'
            echo '```'
            tail -c 6000 build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            grep -iE 'error|exception|failure|what went wrong' build.txt | head -15 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $code

      - name: APK dosya adını sabitle
        run: cp build/app/outputs/flutter-apk/app-release.apk aile-ile-namaz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aile-ile-namaz-apk
          path: aile-ile-namaz.apk

      - name: Sürüm notlarını hazırla (RELEASE_NOTES.md + teknik ayrıntılar)
        if: github.ref == 'refs/heads/main'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          V="v${{ env.APP_VERSION }}"
          D="$(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
          echo "RELEASE_TITLE=$V — $D" >> "$GITHUB_ENV"
          {
            # İlk satır uygulama içi güncelleme penceresinde gösterilir
            echo "$(head -n 1 RELEASE_NOTES.md)"
            tail -n +2 RELEASE_NOTES.md
            echo
            echo "---"
            echo "**Sürüm:** $V · derleme ${{ env.BUILD_NO }} · $D (İstanbul) · commit \`${GITHUB_SHA::7}\`"
            echo
            echo "**Bu güncellemedeki değişiklik:** $(printf '%s' "$COMMIT_MSG" | head -n 1)"
          } > release_body.md

      - name: Yayınla (uygulama içi güncelleme buradan okur)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ env.BUILD_NO }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_body.md
          prerelease: false
          make_latest: true
          files: aile-ile-namaz.apk
