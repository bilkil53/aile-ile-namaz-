name: İmza anahtarı yedeği (şifreli, elle)

# Yalnızca elle başlatılır. İmza anahtarını (keystore) ve bilgilerini, senin belirlediğin yedek şifresiyle
# şifrelenmiş tek bir .7z dosyasına koyar; dosya 1 gün boyunca bu çalışmanın "Artifacts" bölümünden indirilebilir.
# Depo herkese açık olduğu için dosya ŞİFRESİZ asla yayınlanmaz; yedek şifresi en az 16 karakter olmalıdır.
# Gerekli gizli ayar: KEYSTORE_BACKUP_PASSWORD (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yedek:
    runs-on: ubuntu-latest
    steps:
      - name: Şifreli yedek dosyasını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YEDEK_SIFRE: ${{ secrets.KEYSTORE_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${YEDEK_SIFRE:-}" ]; then echo "::error::KEYSTORE_BACKUP_PASSWORD gizli ayarı yok; yedek alınmadı."; exit 1; fi
          if [ "${#YEDEK_SIFRE}" -lt 16 ]; then echo "::error::Yedek şifresi en az 16 karakter olmalı; yedek alınmadı."; exit 1; fi
          if [ -z "${KEYSTORE_B64:-}" ]; then echo "::error::İmza anahtarı gizli ayarı (ANDROID_KEYSTORE_BASE64) yok."; exit 1; fi
          # Derleme işiyle aynı varsayılanlar: takma ad gizli ayarı yoksa "upload", anahtar şifresi = depo şifresi
          KEY_ALIAS="${KEY_ALIAS:-upload}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          W="$RUNNER_TEMP/yedek"; mkdir -p "$W"; cd "$W"
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          # Anahtar gerçekten açılıyor mu (bozuk yedek alınmasın)
          if ! keytool -list -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::İmza anahtarı açılamadı (takma ad '$KEY_ALIAS' ya da depo şifresi uyuşmuyor); yedek alınmadı."; exit 1
          fi
          {
            echo "Aile İle Namaz — imza anahtarı yedeği"
            echo "Tarih (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Dosya: upload.jks"
            echo "Anahtar adı (alias): $KEY_ALIAS"
            echo "Depo (keystore) şifresi: $KEYSTORE_PASSWORD"
            echo "Anahtar şifresi: $KEY_PASSWORD"
            echo "SHA-256 (upload.jks): $(sha256sum upload.jks | cut -d' ' -f1)"
          } > bilgiler.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          7z a -t7z -mhe=on -p"$YEDEK_SIFRE" "$GITHUB_WORKSPACE/out/imza-anahtari-yedegi.7z" upload.jks bilgiler.txt > /dev/null
          # Yedek, şifreyle geri açılabiliyor mu
          7z t -p"$YEDEK_SIFRE" "$GITHUB_WORKSPACE/out/imza-anahtari-yedegi.7z" > /dev/null
          rm -f upload.jks bilgiler.txt
          echo "Şifreli yedek hazır ve geri açma denemesi başarılı."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imza-anahtari-yedegi
          path: out/imza-anahtari-yedegi.7z
          retention-days: 1
          if-no-files-found: error
