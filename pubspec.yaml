name: aile_ile_namaz
description: Aile ile Namaz - aile havuzu ile namaz takibi
publish_to: 'none'
# Sürüm adı/numarası CI'da --build-name / --build-number ile verilir (README: Sürümleme); bu değer kullanılmaz.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  in_app_update: ^4.2.3
  open_filex: ^4.6.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  sensors_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  crypto: ^3.0.6
  intl: any # flutter_localizations sabit bir intl sürümü ister
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
